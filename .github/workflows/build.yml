
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS Glass ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            syslinux-utils \
            wget \
            ca-certificates \
            python3

      - name: Prepare SybaOS configuration
        shell: bash
        run: |
          set -e

          sudo mkdir -p config/package-lists
          sudo mkdir -p config/archives
          sudo mkdir -p config/includes.chroot/etc/skel

          cat <<'EOF' | sudo tee config/package-lists/sybaos.list.chroot
          linux-image-amd64
          live-boot
          live-config
          live-config-systemd
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

          cat <<'EOF' | sudo tee config/archives/security.list.chroot
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          # Prefer the systemd live-config component.
          echo "live-config-systemd" | sudo tee config/package-lists/zz-systemd.list.chroot

      - name: Configure SybaOS Glass
        shell: bash
        run: |
          set -e

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --linux-packages none \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Verify live-config packages
        shell: bash
        run: |
          set -e

          echo "Checking available live-config packages..."
          apt-cache show live-config-systemd >/dev/null

          if apt-cache show live-config-sysvinit >/dev/null; then
            echo "SysV init component exists in the repository."
            echo "The package lists explicitly select the systemd component."
          fi

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: Find generated ISO
        id: find_iso
        shell: bash
        run: |
          set -e

          ISO_FILE="$(find . -maxdepth 4 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file was generated."
            echo "Build directory contents:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SybaOS Glass ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: ${{ steps.find_iso.outputs.iso_file }}
          if-no-files-found: error
          retention-days: 7
