
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS Glass ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            syslinux-utils \
            ca-certificates \
            wget

      - name: Prepare SybaOS Glass
        shell: bash
        run: |
          set -e

          mkdir -p config/package-lists
          mkdir -p config/archives
          mkdir -p config/includes.chroot/etc/skel

          # Remove stale selections of the conflicting backend.
          find config/package-lists -type f \
            -exec sed -i \
            '/^[[:space:]]*live-config-sysvinit[[:space:]]*$/d' {} +

          cat > config/package-lists/sybaos.list.chroot <<'EOF'
          linux-image-amd64
          live-boot
          live-config
          live-config-systemd
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

          # Prevent APT from choosing the SysV live-config backend.
          cat > config/archives/zz-no-sysv.pref.chroot <<'EOF'
          Package: live-config-sysvinit
          Pin: version *
          Pin-Priority: -1
          EOF

          cat > config/archives/security.list.chroot <<'EOF'
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          echo "=== Checking for conflicting package selections ==="
          if grep -R -n -E 'live-config-sysvinit' \
            config/package-lists; then
            echo "ERROR: SysV backend is still listed."
            exit 1
          fi

          echo "=== SybaOS package list ==="
          cat config/package-lists/sybaos.list.chroot

      - name: Configure live-build
        shell: bash
        run: |
          set -e

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --linux-packages none \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Check configuration
        shell: bash
        run: |
          echo "=== live-build version ==="
          lb --version

          echo "=== Init backend references ==="
          grep -R -n -E \
            'live-config-sysvinit|sysvinit-core|systemd-sysv' \
            config 2>/dev/null || true

          echo "=== APT pin file ==="
          cat config/archives/zz-no-sysv.pref.chroot

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: Locate ISO
        id: find_iso
        shell: bash
        run: |
          set -e

          ISO_FILE="$(find . -maxdepth 5 -type f \
            -name '*.iso' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

          echo "Found: $ISO_FILE"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SybaOS Glass ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: ${{ steps.find_iso.outputs.iso_file }}
          if-no-files-found: error
          retention-days: 7
