
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS Glass ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            syslinux-utils \
            wget \
            ca-certificates \
            python3

      - name: Locate and patch live-build
        shell: bash
        run: |
          set -e

          echo "Searching for live-build scripts..."

          LB_SCRIPT="$(command -v lb)"
          echo "lb executable: $LB_SCRIPT"

          dpkg -L live-build | grep -E 'lb_chroot_linux-image$' || true

          SCRIPT="$(dpkg -L live-build | grep -E '/lb_chroot_linux-image$' | head -n 1 || true)"

          if [ -z "$SCRIPT" ]; then
            echo "Kernel helper script not found at the expected path."
            echo "Listing relevant installed files:"
            dpkg -L live-build | grep -E 'linux-image|linux_image|live/build' | head -100 || true
            exit 0
          fi

          echo "Found helper: $SCRIPT"
          sudo cp "$SCRIPT" "${SCRIPT}.original"

          sudo python3 - "$SCRIPT" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          replacements = [
              (
                  '/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURE}.gz',
                  '/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURE}.gz'
              ),
              (
                  '/dists/$LB_DISTRIBUTION/Contents-$LB_ARCHITECTURE.gz',
                  '/dists/$LB_DISTRIBUTION/main/Contents-$LB_ARCHITECTURE.gz'
              ),
          ]

          updated = text
          for old, new in replacements:
              updated = updated.replace(old, new)

          if updated != text:
              path.write_text(updated)
              print("Patched the Contents URL.")
          else:
              print("No matching URL found; the helper was left unchanged.")
              print("Relevant lines:")
              for line in text.splitlines():
                  if "Contents-" in line or "Contents-" in line.replace(" ", ""):
                      print(line)
          PY

      - name: Prepare SybaOS configuration
        shell: bash
        run: |
          set -e

          sudo mkdir -p config/package-lists
          sudo mkdir -p config/archives
          sudo mkdir -p config/includes.chroot/etc/skel

          cat <<'EOF' | sudo tee config/package-lists/sybaos.list.chroot
          linux-image-amd64
          live-boot
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

          cat <<'EOF' | sudo tee config/archives/security.list.chroot
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

      - name: Configure SybaOS Glass
        shell: bash
        run: |
          set -e

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --linux-packages linux-image-amd64 \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: Find generated ISO
        id: find_iso
        shell: bash
        run: |
          set -e

          ISO_FILE="$(find . -maxdepth 3 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file was generated."
            echo "Files in the build directory:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SybaOS Glass ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: ${{ steps.find_iso.outputs.iso_file }}
          if-no-files-found: error
          retention-days: 7
