
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS Glass ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            syslinux-utils \
            wget \
            ca-certificates \
            python3

      - name: Inspect live-build kernel helper
        shell: bash
        run: |
          echo "=== live-build version ==="
          lb --version || true

          echo "=== Locate kernel helper ==="
          dpkg -L live-build | grep 'lb_chroot_linux-image' || true

          echo "=== Search for Contents URL ==="
          sudo grep -R -n -E \
            'Contents-|LB_DISTRIBUTION|LB_MIRROR_CHROOT' \
            /usr/lib/live/build \
            /usr/share/live/build \
            /usr/bin/lb \
            2>/dev/null || true

      - name: Patch live-build Contents URL
        shell: bash
        run: |
          set -e

          sudo python3 <<'PY'
          import pathlib
          import subprocess
          import re
          import sys

          result = subprocess.run(
              ["dpkg-query", "-L", "live-build"],
              capture_output=True,
              text=True,
              check=True
          )

          files = [
              pathlib.Path(line)
              for line in result.stdout.splitlines()
              if line and pathlib.Path(line).is_file()
          ]

          changed_any = False

          for path in files:
              try:
                  original = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original

              # Handle common ways live-build constructs the URL.
              updated = updated.replace(
                  '/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURE}.gz',
                  '/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURE}.gz'
              )

              updated = updated.replace(
                  '/dists/$LB_DISTRIBUTION/Contents-$LB_ARCHITECTURE.gz',
                  '/dists/$LB_DISTRIBUTION/main/Contents-$LB_ARCHITECTURE.gz'
              )

              updated = updated.replace(
                  '/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURE}',
                  '/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURE}'
              )

              if updated != original:
                  backup = path.with_suffix(
                      path.suffix + ".sybaos-backup"
                  )
                  backup.write_text(original)
                  path.write_text(updated)
                  print(f"Patched: {path}")
                  changed_any = True

          if not changed_any:
              print(
                  "No known URL pattern was found. "
                  "The diagnostic output above will help identify the actual code."
              )
          PY

      - name: Prepare SybaOS configuration
        shell: bash
        run: |
          set -e

          sudo mkdir -p config/package-lists
          sudo mkdir -p config/archives
          sudo mkdir -p config/includes.chroot/etc/skel

          cat <<'EOF' | sudo tee config/package-lists/sybaos.list.chroot
          linux-image-amd64
          live-boot
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

          cat <<'EOF' | sudo tee config/archives/security.list.chroot
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

      - name: Configure SybaOS Glass
        shell: bash
        run: |
          set -e

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --linux-packages linux-image-amd64 \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: Find generated ISO
        id: find_iso
        shell: bash
        run: |
          set -e

          ISO_FILE="$(find . -maxdepth 3 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file was generated."
            echo "Build directory contents:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SybaOS Glass ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: ${{ steps.find_iso.outputs.iso_file }}
          if-no-files-found: error
          retention-days: 7
