
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            rsync

      - name: Configure SybaOS Glass
        run: |
          mkdir -p sybaos
          cd sybaos

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

          sudo sed -i \
            's|https://deb.debian.org/debian/|https://deb.debian.org/debian|g' \
            config/bootstrap

          sudo mkdir -p config/archives

          sudo tee config/archives/security.list.chroot > /dev/null <<'EOF'
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          sudo mkdir -p config/package-lists

          sudo tee config/package-lists/sybaos.list.chroot > /dev/null <<'EOF'
          linux-image-amd64
          live-boot
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

      - name: Build ISO
        run: |
          cd sybaos
          sudo lb build

          sudo find . -maxdepth 1 -type f -name '*.iso' \
            -exec cp {} "$GITHUB_WORKSPACE/" \;

          if ! find "$GITHUB_WORKSPACE" -maxdepth 1 \
            -type f -name '*.iso' -print -quit | grep -q .; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE"/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
