
name: Build SybaOS Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SybaOS Glass ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            syslinux \
            syslinux-common \
            isolinux \
            ca-certificates \
            wget

          echo "=== Checking ISOLINUX files ==="
          dpkg -L isolinux | grep -E '/(isolinux\.bin|vesamenu\.c32)$' || true

      - name: Prepare SybaOS Glass
        shell: bash
        run: |
          set -e

          mkdir -p config/package-lists
          mkdir -p config/archives
          mkdir -p config/includes.chroot/etc/skel

          # Remove old live-build package selections.
          rm -f config/package-lists/live.list.chroot

          # Remove stale SysV backend selections.
          find config/package-lists -type f \
            -exec sed -i \
            '/^[[:space:]]*live-config-sysvinit[[:space:]]*$/d' {} +

          cat > config/package-lists/sybaos.list.chroot <<'EOF'
          linux-image-amd64
          live-boot
          live-config
          live-config-systemd
          systemd-sysv
          task-xfce-desktop
          lightdm
          firefox-esr
          libreoffice
          vlc
          thunar
          network-manager
          network-manager-gnome
          xfce4-terminal
          xfce4-whiskermenu-plugin
          plank
          picom
          papirus-icon-theme
          fonts-noto
          fonts-noto-color-emoji
          EOF

          cat > config/archives/security.list.chroot <<'EOF'
          deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          echo "=== Checking package selections ==="
          if grep -R -n 'live-config-sysvinit' config/package-lists; then
            echo "ERROR: SysV backend is still selected."
            exit 1
          fi

      - name: Configure live-build
        shell: bash
        run: |
          set -e

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --initsystem systemd \
            --linux-packages none \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware"

      - name: Verify bootloader files
        shell: bash
        run: |
          set -e

          echo "=== ISOLINUX package files ==="
          dpkg -L isolinux | grep -E '/(isolinux\.bin|vesamenu\.c32)$' || true

          echo "=== Candidate bootloader paths ==="
          find /usr/lib/ISOLINUX /usr/lib/syslinux /usr/share/syslinux \
            -type f \( -name isolinux.bin -o -name vesamenu.c32 \) \
            2>/dev/null || true

          echo "=== live-build version ==="
          lb --version

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: Locate ISO
        id: find_iso
        shell: bash
        run: |
          set -e

          ISO_FILE="$(find . -maxdepth 5 -type f \
            -name '*.iso' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SybaOS Glass ISO
        uses: actions/upload-artifact@v4
        with:
          name: SybaOS-Glass-ISO
          path: ${{ steps.find_iso.outputs.iso_file }}
          if-no-files-found: error
          retention-days: 7
